name: Web / GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust with the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Verify the Suu core
        run: cargo test -p suu --release
      - name: Build the page (wasm, dictionary, fonts)
        run: sh tools/build-web.sh
      - name: Package the site
        run: |
          mkdir _site
          cp -R web/. _site/
          rm -f _site/.gitignore
          cp LICENSE _site/LICENSE
          cp crates/chimera/LICENSE _site/LICENSE-CHIMERA
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
