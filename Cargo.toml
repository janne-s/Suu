[workspace]
resolver = "3"
members = ["crates/chimera", "crates/suu", "crates/suu-wasm"]
exclude = ["plugin"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
