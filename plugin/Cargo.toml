[package]
name = "suu_plugin"
description = "Suu as a plug-in: the shared code of the effect (suu_fx) and the instrument (suu_synth)"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["fx", "synth", "xtask"]
exclude = ["vendor"]

[dependencies]
suu = { path = "../crates/suu" }
chimera = { path = "../crates/chimera" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
crossbeam-channel = "0.5"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nih_plug_webview = { git = "https://github.com/httnn/nih-plug-webview", rev = "745d79a32fb21374758812e49436cb2a21e217fd" }
rfd = "0.15"
raw-window-handle = "0.6"
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.profiling]
inherits = "release"
debug = true

[patch.crates-io]
wry = { path = "vendor/wry-0.35.2" }
